spring:
  application:
    name: api-gateway

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    gateway:
      server:
        webflux:
          # Побеждает первый подходящий маршрут в порядке order. Поэтому вынесенные сервисы
          # идут раньше монолита: его маршрут /api/** перехватил бы всё. Порядок задан явно,
          # а не положением в списке — так он не зависит от того, как список собран.
          #
          # Вынос следующего модуля из монолита — это новая строка здесь. Клиент при этом
          # не меняет ни одного URL: ради этого шлюз и нужен.
          routes:
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              order: 1
              predicates:
                - Path=/api/v1/notifications/**

            # Пользователи: регистрация, вход и их администрирование.
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8085}
              order: 1
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/users,/api/v1/admin/users/**

            # Платежи читает payment-service — только GET. Запуск оплаты (POST на тот же адрес)
            # принадлежит сервису заказов: он ведёт сагу, а сюда она приходит командой через
            # Kafka. Один путь, два владельца — различает их метод запроса.
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              order: 1
              predicates:
                - Path=/api/v1/customers/*/payments,/api/v1/customers/*/orders/*/payments
                - Method=GET

            # Пути под заказами и доставками, которые остались у монолита: трек курьера, отзыв
            # о заказе, рекомендации. Стоят раньше сервиса заказов — его маршрут
            # /api/v1/customers/*/orders/** забрал бы и их.
            - id: core-order-scoped
              uri: ${CORE_SERVICE_URL:http://localhost:8082}
              order: 2
              predicates:
                - Path=/api/v1/customers/*/orders/*/track,/api/v1/customers/*/orders/*/review,/api/v1/customers/*/recommendations,/api/v1/couriers/*/deliveries/*/track,/api/v1/couriers/*/deliveries/*/positions

            # Пути под /restaurants/{id}, которые остались у монолита: отзывы и аналитика.
            # Рестораном их делает только префикс пути, а данные принадлежат монолиту.
            # Маршрут стоит раньше каталожного /api/v1/restaurants/**, иначе тот забрал бы и их.
            - id: core-restaurant-scoped
              uri: ${CORE_SERVICE_URL:http://localhost:8082}
              order: 2
              predicates:
                - Path=/api/v1/restaurants/*/reviews,/api/v1/restaurants/*/reviews/**,/api/v1/restaurants/*/analytics/**

            # Корзина, заказы клиента и ресторана, доставки, запуск оплаты и журнал аудита заказов.
            # Заказы ресторана живут под /restaurants/{id}, поэтому маршрут стоит раньше каталога.
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8086}
              order: 3
              predicates:
                - Path=/api/v1/customers/*/restaurants/*/cart,/api/v1/customers/*/restaurants/*/cart/**,/api/v1/customers/*/restaurants/*/orders,/api/v1/customers/*/orders,/api/v1/customers/*/orders/**,/api/v1/restaurants/*/orders,/api/v1/restaurants/*/orders/**,/api/v1/deliveries/**,/api/v1/couriers/*/deliveries,/api/v1/couriers/*/deliveries/**,/api/v1/admin/audit,/api/v1/admin/audit/**

            # Каталог: рестораны, меню, поиск и его администрирование.
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
              order: 4
              predicates:
                - Path=/api/v1/restaurants,/api/v1/restaurants/**,/api/v1/search,/api/v1/admin/search/**

            # Монолит: всё, что ещё не вынесено. Swagger UI тоже его.
            - id: core
              uri: ${CORE_SERVICE_URL:http://localhost:8082}
              order: 100
              predicates:
                - Path=/api/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

          default-filters:
            # Пользователя определяет подписанный токен, и только он. Заголовок с тем же
            # смыслом, пришедший снаружи, срезается ещё на входе: стоит одному сервису когда-
            # нибудь начать ему доверять, и любой клиент назовётся кем угодно. Сервисы
            # заголовку и так не верят — это вторая линия, а не единственная.
            - RemoveRequestHeader=X-User-Id

          httpclient:
            # Таймауты обязательны. По умолчанию их нет: зависший сервис держал бы
            # соединение шлюза бесконечно, а с ним и клиента. Лучше быстро отдать 504.
            connect-timeout: 2000
            response-timeout: 15s

management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        # gateway — список маршрутов: удобно проверить, куда на самом деле уходит запрос.
        # Только на служебном порту, наружу он не публикуется.
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
    com.dima.fooddelivery: DEBUG
